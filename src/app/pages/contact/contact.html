<div class="col-lg-8">
    <h4 class="mb-3">Me Contacter</h4>
    <form
        class="needs-validation"
        novalidate=""
        data-np-autofill-form-type="credit_card"
        data-np-checked="1"
        data-np-watching="1"
    >
        <div class="row g-3">
            <div class="col-sm-6">
                <label for="firstName" class="form-label">Prénom</label>
                <input
                type="text"
                class="form-control"
                id="firstName"
                placeholder=""
                value=""
                required=""
                data-np-autofill-field-type="firstName"
                />
            </div>
            <div class="col-12">
                <label for="email" class="form-label">Email</label>
                <input
                type="email"
                class="form-control"
                id="email"
                placeholder="you@example.com"
                data-np-autofill-field-type="email"
                />
                <div class="invalid-feedback">
                Please enter a valid email address for shipping updates.
                </div>
            </div>
            <div class="col-12">
                <label for="email" class="form-label">message</label>
                <input
                type="message"
                class="form-control"
                id="message"
                data-np-autofill-field-type="message"
                />
                <div class="invalid-feedback">
                Please enter a valid email address for shipping updates.
                </div>
            </div>
            <button class="w-100 btn btn-primary btn-lg" type="submit">
            Continue to checkout
            </button>
        </div>
    </form>
</div>

<!-- Contact form -->
<script type="text/javascript" src="js/jquery-1.11.2.min.js"></script>
<script type="text/javascript" src="js/validator.min.js"></script>
<script type="text/javascript" src="js/form-scripts.js"></script>
